evaluation:
  auto_cv_threshold: 3.5
  # German filter policy: reject_b1_plus (default), reject_b2_plus_only, reject_unless_bilingual, accept_all
  # reject_b1_plus          = reject B1 and B2+ (strictest — only A1-A2 or none pass)
  # reject_b2_plus_only     = reject only B2+ (B1 jobs pass through)
  # reject_unless_bilingual  = reject German jobs UNLESS the JD also requires English
  # accept_all              = don't auto-reject any German level
  german_filter: reject_b1_plus
  # OpenRouter model chain (tried in order; first success wins)
  # See https://openrouter.ai/models for available free models
  openrouter_models:
    - "google/gemma-4-26b-a4b-it:free"         # Primary — verified free 2026-09-02
    - "google/gemma-4-31b-it:free"            # Fallback 1 — free, rate-limited
    - "liquid/lfm-2.5-2.6b:free"               # Fallback 2 — Liquid, free
    - "z-ai/glm-5.2:free"                      # Fallback 3 — GLM, free
    - "nvidia/nemotron-3.5-lightning:free"     # Fallback 4 — Nemotron, free
    - "openai/gpt-oss-120b:free"              # Legacy — may 404, keep last
  # Google AI Studio models (for evaluation, separate from OpenRouter)
  google_models:
    - "gemma-4-26b-a4b-it"                   # Primary — more reliable
    - "gemma-4-31b-it"                       # Backup

queue_export:
  # UniversalAutoApplier-ready application queue (JSONL). Written atomically
  # by run_all.py after a successful scan + evaluate + doc-generation run.
  # Re-running overwrites the file (idempotent); a failed export fails the
  # pipeline and leaves the previous queue untouched.
  output_path: data/application_queue.jsonl
